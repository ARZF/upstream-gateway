services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Keep SQLite and its WAL files on the volume, regardless of local settings.
      DATABASE_URL: sqlite:////data/gateway.db
    volumes:
      - gateway_data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2).close()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  gateway_data:
