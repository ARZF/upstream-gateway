<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="upstream-gateway-architecture-title upstream-gateway-architecture-desc" id="upstream-gateway-architecture-root">
        <title id="upstream-gateway-architecture-title">Upstream Gateway request flow</title>
        <desc id="upstream-gateway-architecture-desc">System architecture showing a client request entering FastAPI, passing through provider routing and HTTPX to upstream providers, then being recorded in PostgreSQL before the response returns.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #upstream-gateway-architecture-root { --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #upstream-gateway-architecture-root { color: var(--color-ink); font-family: var(--font-sans); }
      #upstream-gateway-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#upstream-gateway-architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="upstream-gateway-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="upstream-gateway-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="upstream-gateway-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Gateway process boundary -->
        <rect x="192" y="180" width="544" height="220" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.12"/>
        <rect x="208" y="184" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="264" y="193" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">GATEWAY PROCESS</text>

        <!-- Request path -->
        <line x1="168" y1="244" x2="216" y2="244" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#upstream-gateway-architecture-arrow-link)"/>
        <line x1="360" y1="244" x2="392" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#upstream-gateway-architecture-arrow)"/>
        <line x1="544" y1="244" x2="576" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#upstream-gateway-architecture-arrow)"/>
        <line x1="712" y1="244" x2="776" y2="244" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#upstream-gateway-architecture-arrow-link)"/>

        <!-- Return path -->
        <line x1="776" y1="268" x2="712" y2="268" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#upstream-gateway-architecture-arrow-link)"/>
        <line x1="576" y1="268" x2="544" y2="268" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#upstream-gateway-architecture-arrow)"/>
        <line x1="392" y1="268" x2="360" y2="268" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#upstream-gateway-architecture-arrow)"/>
        <line x1="216" y1="268" x2="168" y2="268" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#upstream-gateway-architecture-arrow)"/>

        <!-- Persistence and deployment paths -->
        <path d="M 288,292 V 344 Q 288,352 296,352 H 392" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#upstream-gateway-architecture-arrow)"/>
        <line x1="464" y1="384" x2="464" y2="436" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#upstream-gateway-architecture-arrow)"/>
        <line x1="352" y1="468" x2="392" y2="468" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#upstream-gateway-architecture-arrow)"/>

        <!-- Arrow labels, offset from their connectors -->
        <rect x="176" y="224" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="192" y="233" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST</text>
        <rect x="176" y="276" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="192" y="285" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESP</text>
        <rect x="724" y="224" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="744" y="233" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>
        <rect x="720" y="276" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="744" y="285" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESULT</text>
        <rect x="480" y="404" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="504" y="413" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COMMIT</text>

        <!-- API Client -->
        <rect x="32" y="220" width="136" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="32" y="220" width="136" height="72" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="40" y="228" width="28" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="54" y="237" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="100" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API Client</text>
        <text x="100" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">validated JSON</text>

        <!-- FastAPI routes -->
        <rect x="216" y="220" width="144" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="216" y="220" width="144" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="224" y="228" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="238" y="237" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="288" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FastAPI Routes</text>
        <text x="288" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/api/v1/process</text>

        <!-- Provider service and SmartRouter -->
        <rect x="392" y="220" width="152" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="392" y="220" width="152" height="72" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="400" y="228" width="36" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="418" y="237" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="468" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Provider Service</text>
        <text x="468" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SmartRouter · fallback</text>

        <!-- Provider client -->
        <rect x="576" y="220" width="136" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="576" y="220" width="136" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="584" y="228" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="602" y="237" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text>
        <text x="644" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Provider Client</text>
        <text x="644" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shared HTTPX</text>

        <!-- Upstream providers -->
        <rect x="776" y="220" width="152" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="776" y="220" width="152" height="72" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="784" y="228" width="28" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="798" y="237" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="852" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Providers A–C</text>
        <text x="852" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">external HTTP APIs</text>

        <!-- Synchronous database adapter -->
        <rect x="392" y="320" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="392" y="320" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="400" y="328" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="414" y="337" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ORM</text>
        <text x="468" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Database</text>
        <text x="468" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sync SQLAlchemy</text>

        <!-- Alembic deployment step -->
        <rect x="216" y="436" width="136" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="216" y="436" width="136" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="224" y="444" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="238" y="453" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MIG</text>
        <text x="284" y="468" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Alembic</text>
        <text x="284" y="488" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">upgrade head</text>

        <!-- PostgreSQL store -->
        <rect x="392" y="436" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="392" y="436" width="152" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1.2" fill-opacity="0.05"/>
        <rect x="400" y="444" width="24" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="412" y="453" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="468" y="468" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL</text>
        <text x="468" y="488" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">requests table</text>

        <!-- Legend strip -->
        <line x1="32" y1="532" x2="928" y2="532" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="32" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="112" y="544" width="16" height="12" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="136" y="554" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">External</text>
        <rect x="216" y="544" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="240" y="554" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Application</text>
        <rect x="340" y="544" width="16" height="12" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="364" y="554" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Store</text>
        <line x1="432" y1="550" x2="464" y2="550" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#upstream-gateway-architecture-arrow-link)"/>
        <text x="476" y="554" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">HTTP / API</text>
        <rect x="572" y="544" width="16" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="596" y="554" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Routing focal</text>
        <line x1="692" y1="550" x2="724" y2="550" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#upstream-gateway-architecture-arrow)"/>
        <text x="736" y="554" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Return / setup</text>
      </svg>
